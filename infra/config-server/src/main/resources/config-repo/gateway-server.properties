server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=false


spring.cloud.gateway.routes[0].id=user-service-admin
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/admin/users/**


spring.cloud.gateway.routes[1].id=request-service-user-requests
spring.cloud.gateway.routes[1].uri=lb://request-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/*/requests/**

spring.cloud.gateway.routes[2].id=request-service-event-requests
spring.cloud.gateway.routes[2].uri=lb://request-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/users/*/events/*/requests/**


spring.cloud.gateway.routes[3].id=event-service-private
spring.cloud.gateway.routes[3].uri=lb://event-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/users/*/events/**

spring.cloud.gateway.routes[4].id=event-service-admin
spring.cloud.gateway.routes[4].uri=lb://event-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/admin/events/**,/admin/categories/**,/admin/compilations/**

spring.cloud.gateway.routes[5].id=event-service-public
spring.cloud.gateway.routes[5].uri=lb://event-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/events/**,/categories/**,/compilations/**

spring.cloud.gateway.routes[6].id=additional-service-locations
spring.cloud.gateway.routes[6].uri=lb://additional-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/admin/locations/**